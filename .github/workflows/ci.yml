name: CUTOVER CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cutover-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  production-dependency-audit:
    name: Production dependency audit (temporary evidence run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Run npm audit --omit=dev
        run: npm audit --omit=dev --json

  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install pinned Node toolchain
        run: npm ci
      - run: python -m compileall -q contracts tests scripts
      - run: python scripts/check_contract_surface.py
      - run: python scripts/repository_integrity.py
      - run: node scripts/check-network.mjs
      - run: node scripts/live/proof_runner.mjs proof/live-plan.example.json --offline-dry-run

  contract:
    name: Contract lint + Direct Mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: GenVM lint
        env:
          GENVM_VERSION: v0.2.16
        run: genvm-lint check contracts/cutover.py
      - name: Direct Mode
        run: pytest tests/direct -v

  contract-mutation:
    name: Actual CUTOVER contract mutation sweep
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/contract_mutation.py

  web:
    name: Web lint + types + tests + builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:web
      - run: npm run build -w @cutover/web
      - run: npm run build -w @cutover/fixtures

  frontend-mutation:
    name: Frontend mutation sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run mutation:web

  gate:
    name: CUTOVER GitHub gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run test:gate
      - run: npm run typecheck -w @cutover/gate
      - run: npm run build -w @cutover/gate
      - name: Verify committed action bundle
        run: |
          test -s packages/gate/dist/index.js
          test -s packages/gate/dist/338.index.js
          git ls-files --error-unmatch packages/gate/dist/338.index.js
          git diff --exit-code -- packages/gate/dist/index.js packages/gate/dist/338.index.js

  live-gate-proof:
    name: CUTOVER live Studionet action proof
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install pinned Node dependencies
        run: npm ci
      - name: PASS exact authorized revised-source migration 1 candidate ref
        id: exact-ref
        uses: ./packages/gate
        with:
          contract-address: "0x2A19548ae8A86a6d678890095f9F25eddeC16DD3"
          migration-id: "1"
          expected-candidate-ref: c75641176acc263f9a35fab2d9b7c9f9bfb29c19
          chain-id: "61999"
      - name: FAIL a mismatched candidate ref
        id: wrong-ref
        continue-on-error: true
        uses: ./packages/gate
        with:
          contract-address: "0x2A19548ae8A86a6d678890095f9F25eddeC16DD3"
          migration-id: "1"
          expected-candidate-ref: cutover-live-proof-wrong-ref
          chain-id: "61999"
      - name: Assert the wrong-ref failure came from the exact-ref guard
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.wrong-ref.outcome }}
          GATE_ERROR: ${{ steps.wrong-ref.outputs.gate-error }}
        run: |
          test "$ACTION_OUTCOME" = "failure"
          [[ "$GATE_ERROR" == *"does not equal expected cutover-live-proof-wrong-ref"* ]]
      - name: FAIL a non-AUTHORIZED INCONCLUSIVE migration
        id: blocked-state
        continue-on-error: true
        uses: ./packages/gate
        with:
          contract-address: "0x2A19548ae8A86a6d678890095f9F25eddeC16DD3"
          migration-id: "2"
          expected-candidate-ref: c75641176acc263f9a35fab2d9b7c9f9bfb29c19
          chain-id: "61999"
      - name: Assert the INCONCLUSIVE-state failure came from the state guard
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.blocked-state.outcome }}
          GATE_ERROR: ${{ steps.blocked-state.outputs.gate-error }}
        run: |
          test "$ACTION_OUTCOME" = "failure"
          [[ "$GATE_ERROR" == *"CUTOVER state is INCONCLUSIVE, expected AUTHORIZED"* ]]

  generated-artifacts:
    name: Verify lockfile + action bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run build -w @cutover/gate
      - name: Verify generated deliverables are committed
        run: |
          test -s package-lock.json
          test -s packages/gate/dist/index.js
          test -s packages/gate/dist/338.index.js
          git ls-files --error-unmatch packages/gate/dist/338.index.js
          git diff --exit-code -- package-lock.json packages/gate/dist/index.js packages/gate/dist/338.index.js
      - name: Stage generated deliverables
        run: |
          mkdir -p generated/packages/gate/dist
          cp package-lock.json generated/package-lock.json
          cp packages/gate/dist/index.js generated/packages/gate/dist/index.js
          cp packages/gate/dist/338.index.js generated/packages/gate/dist/338.index.js
      - uses: actions/upload-artifact@v4
        with:
          name: cutover-generated-files
          path: generated
          if-no-files-found: error

  package:
    name: Package handoff ZIP
    needs: [repository-integrity, contract, contract-mutation, web, frontend-mutation, gate, generated-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cutover-generated-files
          path: generated
      - name: Overlay generated deliverables
        run: |
          cp generated/package-lock.json package-lock.json
          mkdir -p packages/gate/dist
          cp generated/packages/gate/dist/index.js packages/gate/dist/index.js
          cp generated/packages/gate/dist/338.index.js packages/gate/dist/338.index.js
          rm -rf generated
      - name: Create source handoff
        run: |
          zip -r cutover-chatgpt-pro-handoff.zip . \
            -x '.git/*' 'node_modules/*' '*/node_modules/*' '.next/*' '*/.next/*' '.venv/*' '*/.venv/*' \
               '__pycache__/*' '*/__pycache__/*' '*.pyc' '.pytest_cache/*' '*/.pytest_cache/*' \
               'coverage/*' '*/coverage/*' 'artifacts/*' '*/artifacts/*' '.env' '.env.local' '*/.env.local' '*.pem' '*.key'
          unzip -l cutover-chatgpt-pro-handoff.zip | tee handoff-contents.txt
          ! grep -E '(^|/)(node_modules|\.next|\.git|\.venv|__pycache__|\.pytest_cache|coverage|artifacts)/|(^|/)\.env$|(^|/)\.env\.local$|\.pem$|\.key$' handoff-contents.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cutover-chatgpt-pro-handoff
          path: cutover-chatgpt-pro-handoff.zip
          if-no-files-found: error
