name: Apply CUTOVER audited patch
on:
  push:
    branches: [main]
    paths:
      - 'scripts/.cutover-audit-payload.part-*'
permissions:
  contents: write
concurrency:
  group: cutover-audit-apply
  cancel-in-progress: false
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require complete payload
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/.cutover-audit-payload.part-00
          test -f scripts/.cutover-audit-payload.part-01
          count=$(find scripts -maxdepth 1 -name '.cutover-audit-payload.part-*' | wc -l)
          test "$count" -eq 2
      - name: Apply coherent audited tree
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.cutover-audit-payload.part-* | base64 -d > /tmp/cutover-audit.tar.gz
          tar -xzf /tmp/cutover-audit.tar.gz
          while IFS= read -r path; do
            [ -z "$path" ] || rm -f -- "$path"
          done < .audit-delete
          rm -f .audit-delete scripts/.cutover-audit-payload.part-* .github/workflows/audit-apply.yml
          git status --short
      - name: Commit audited implementation batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: harden CUTOVER evidence protocol and product workflows'
          git push origin HEAD:main
